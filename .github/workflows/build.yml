name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Build native desktop helpers
        run: npm run native
      - name: Unit tests
        run: npm test
      - name: Native module smoke test
        run: npm run test:native
      - name: Electron interaction test
        run: npm run test:app
      - name: Idle renderer test
        run: pnpm exec electron scripts/smoke.cjs --performance-only
      - name: Recovery and resize UI test
        run: pnpm exec electron scripts/smoke.cjs --reliability-only
      - name: Package unsigned macOS app
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac --universal --publish never
      - name: Package single-file Windows app
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --x64 --publish never
      - name: Packaged application smoke test
        run: node scripts/package-smoke.cjs
      - name: Single file Windows launcher test
        if: runner.os == 'Windows'
        run: node scripts/package-smoke.cjs --portable
      - uses: actions/upload-artifact@v7
        with:
          name: hali-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
