name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build native desktop helpers
        run: npm run native
      - name: Native module smoke test
        run: npm run test:native
      - name: Package unsigned macOS app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --universal --publish never
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: hali-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
